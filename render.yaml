services:
  - type: web
    name: faatn-gate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: faatn-gate-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: faatn-gate-db
    plan: free
    databaseName: faatn_gate
    user: faatn
