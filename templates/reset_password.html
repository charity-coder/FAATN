{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Reset <span class="gradient-text">Password</span></h1>
      <p>Choose a new password for your account</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min. 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="Repeat password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>
    <div class="auth-footer">
      <a href="{{ url_for('login') }}">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
