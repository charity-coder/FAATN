{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Forgot <span class="gradient-text">Password</span></h1>
      <p>Enter your email and we’ll generate a reset link (demo mode shows the link on screen)</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" required placeholder="you@example.com" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>
    <div class="auth-footer">
      <a href="{{ url_for('login') }}">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
