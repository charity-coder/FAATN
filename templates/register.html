{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-header">
      <h1>Join <span class="gradient-text">FAATN-GATE</span></h1>
      <p>Create your account — Registration & Classification (Routing Engine)</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-row">
        <div class="form-group">
          <label for="full_name">Full Name *</label>
          <input type="text" id="full_name" name="full_name" class="form-control" required placeholder="e.g. Chinedu Okoro">
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+234 800 000 0000">
        </div>
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" required minlength="6" placeholder="Min. 6 characters">
        </div>
      </div>

      <div class="form-group">
        <label for="roleSelect">I am / I represent *</label>
        <select name="role" class="form-control" id="roleSelect">
          <option value="artisan" {% if request.args.get('role') == 'artisan' %}selected{% endif %}>Artisan</option>
          <option value="technician" {% if request.args.get('role') == 'technician' %}selected{% endif %}>Technician</option>
          <option value="engineer" {% if request.args.get('role') == 'engineer' %}selected{% endif %}>Engineer / Technical Professional</option>
          <option value="institution" {% if request.args.get('role') == 'institution' %}selected{% endif %}>Institution (University, TVET…)</option>
          <option value="government" {% if request.args.get('role') == 'government' %}selected{% endif %}>Government / Development Partner</option>
          <option value="industry" {% if request.args.get('role') == 'industry' %}selected{% endif %}>Industry / Private Sector</option>
          <option value="innovation" {% if request.args.get('role') == 'innovation' %}selected{% endif %}>I have an Innovation / Idea</option>
          <option value="opportunity" {% if request.args.get('role') == 'opportunity' %}selected{% endif %}>I have an Opportunity</option>
          <option value="supplier" {% if request.args.get('role') == 'supplier' %}selected{% endif %}>Supplier</option>
          <option value="partner" {% if request.args.get('role') == 'partner' %}selected{% endif %}>I want to Partner with FAATN</option>
        </select>
      </div>

      <!-- State Dropdown Fix -->
      <div class="form-row">
        <div class="form-group">
          <label for="location_state">State</label>
          <select name="location_state" id="location_state" class="form-control">
            <option value="">Select State</option>
            {% for st in states %}
            <option value="{{ st }}">{{ st }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="location_lga">LGA</label>
          <input type="text" id="location_lga" name="location_lga" class="form-control" placeholder="e.g. Awka South">
        </div>
      </div>

      <div class="form-group">
        <label for="location_community">Community</label>
        <input type="text" id="location_community" name="location_community" class="form-control" placeholder="e.g. Amawbia">
      </div>

      <!-- Occupation Dropdown Fix -->
      <div class="form-row">
        <div class="form-group">
          <label for="occupation">Occupation / Trade</label>
          <select name="occupation" id="occupation" class="form-control">
            <option value="">Select Occupation / Trade</option>
            {% for occ in occupations %}
            <option value="{{ occ }}">{{ occ }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="specialty">Specialty / Area of Expertise</label>
          <input type="text" id="specialty" name="specialty" class="form-control" placeholder="e.g. Furniture Making">
        </div>
      </div>

      <div class="form-group">
        <label for="skills">Skills & Capabilities</label>
        <input type="text" id="skills" name="skills" class="form-control" placeholder="Comma separated: Joinery, Finishing, Design…">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="experience_years">Years of Experience</label>
          <input type="number" id="experience_years" name="experience_years" class="form-control" min="0" max="60" value="0">
        </div>
        <div class="form-group">
          <label for="needs">Needs / Opportunities Sought</label>
          <input type="text" id="needs" name="needs" class="form-control" placeholder="Training, Contracts, Funding…">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="whatsapp">WhatsApp</label>
          <input type="text" id="whatsapp" name="whatsapp" class="form-control" placeholder="WhatsApp number">
        </div>
        <div class="form-group">
          <label for="business_name">Business / Workshop Name</label>
          <input type="text" id="business_name" name="business_name" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label for="workshop_address">Workshop Address</label>
        <input type="text" id="workshop_address" name="workshop_address" class="form-control">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="certifications">Certifications (if any)</label>
          <input type="text" id="certifications" name="certifications" class="form-control">
        </div>
        <div class="form-group">
          <label for="references_text">References (if any)</label>
          <input type="text" id="references_text" name="references_text" class="form-control">
        </div>
      </div>

      <div class="form-group supplier-fields">
        <label for="supplier_category">Supplier Category</label>
        <select name="supplier_category" id="supplier_category" class="form-control">
          <option value="">— if registering as supplier —</option>
          {% for c in supplier_categories %}
          <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="products_supplied">Products Supplied</label>
        <textarea id="products_supplied" name="products_supplied" class="form-control" rows="2" placeholder="e.g. 5HP solar pumps, inverters"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">
        Complete Registration →
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
