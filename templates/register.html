{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-header">
      <h1>Join <span class="gradient-text">FAATN-GATE</span></h1>
      <p>Create your account — Registration & Classification (Routing Engine)</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="full_name" class="form-control" required placeholder="e.g. Chinedu Okoro">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" class="form-control" placeholder="+234 800 000 0000">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min. 6 characters">
        </div>
      </div>

      <div class="form-group">
        <label>I am / I represent *</label>
        <select name="role" class="form-control" id="roleSelect">
          <option value="artisan" {% if request.args.get('role') == 'artisan' %}selected{% endif %}>Artisan</option>
          <option value="technician" {% if request.args.get('role') == 'technician' %}selected{% endif %}>Technician</option>
          <option value="engineer" {% if request.args.get('role') == 'engineer' %}selected{% endif %}>Engineer / Technical Professional</option>
          <option value="institution" {% if request.args.get('role') == 'institution' %}selected{% endif %}>Institution (University, TVET…)</option>
          <option value="government" {% if request.args.get('role') == 'government' %}selected{% endif %}>Government / Development Partner</option>
          <option value="industry" {% if request.args.get('role') == 'industry' %}selected{% endif %}>Industry / Private Sector</option>
          <option value="innovation" {% if request.args.get('role') == 'innovation' %}selected{% endif %}>I have an Innovation / Idea</option>
          <option value="opportunity" {% if request.args.get('role') == 'opportunity' %}selected{% endif %}>I have an Opportunity</option>
          <option value="partner" {% if request.args.get('role') == 'partner' %}selected{% endif %}>I want to Partner with FAATN</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>State</label>
          <input type="text" name="location_state" class="form-control" placeholder="e.g. Anambra">
        </div>
        <div class="form-group">
          <label>LGA</label>
          <input type="text" name="location_lga" class="form-control" placeholder="e.g. Awka South">
        </div>
      </div>

      <div class="form-group">
        <label>Community</label>
        <input type="text" name="location_community" class="form-control" placeholder="e.g. Amawbia">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Occupation / Trade</label>
          <input type="text" name="occupation" class="form-control" placeholder="e.g. Carpentry, Electrical">
        </div>
        <div class="form-group">
          <label>Specialty / Area of Expertise</label>
          <input type="text" name="specialty" class="form-control" placeholder="e.g. Furniture Making">
        </div>
      </div>

      <div class="form-group">
        <label>Skills & Capabilities</label>
        <input type="text" name="skills" class="form-control" placeholder="Comma separated: Joinery, Finishing, Design…">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Years of Experience</label>
          <input type="number" name="experience_years" class="form-control" min="0" max="60" value="0">
        </div>
        <div class="form-group">
          <label>Needs / Opportunities Sought</label>
          <input type="text" name="needs" class="form-control" placeholder="Training, Contracts, Funding…">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">
        Complete Registration →
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
